# ============================================================
# Smart Bus Stop AI — Docker Compose
# ============================================================
#
# Services:
#   db        — PostgreSQL 15
#   backend   — FastAPI + ML inference
#   frontend  — React (Nginx, production build)
#   db-init   — One-shot DB seeding (runs after db is healthy)
#
# Simulation is intentionally excluded here because SUMO
# requires host-specific graphics/display setup. See
# simulation/README.md for manual run instructions.
#
# Usage:
#   cp .env.example .env   # configure environment variables
#   docker compose up --build
#
# ============================================================

services:

  # ── PostgreSQL ─────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-smartbusstop}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-smartbusstop}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-smartbusstop}
      BACKEND_CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-80}", "http://localhost:5173"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      APP_ENV: ${APP_ENV:-production}
      RATE_LIMIT: ${RATE_LIMIT:-60/minute}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./data:/data:ro
      - ./ml:/ml:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── DB Initialiser (one-shot) ──────────────────────────────
  db-init:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python scripts/init_db.py
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-changeme}@db:5432/${POSTGRES_DB:-smartbusstop}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # ── Frontend (Nginx + production build) ───────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
